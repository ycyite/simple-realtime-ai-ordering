<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎙️ OpenAI Voice Agent - WebRTC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
            font-weight: 300;
        }

        .sdk-badge {
            text-align: center;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .voice-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            font-size: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 auto 30px;
            display: block;
            position: relative;
            overflow: hidden;
        }

        .voice-button.ready {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }

        .voice-button.ready:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(76, 175, 80, 0.4);
        }

        .voice-button.connecting {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            animation: pulse 1.5s infinite;
        }

        .voice-button.active {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            animation: recording 2s infinite;
        }

        .voice-button.disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .disconnect-button {
            padding: 12px 24px;
            border-radius: 25px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px auto;
            display: block;
            background: linear-gradient(135deg, #ff4757, #c44569);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
        }

        .disconnect-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 71, 87, 0.4);
        }

        .disconnect-button:active {
            transform: translateY(0);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes recording {
            0%, 100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(244, 67, 54, 0); }
        }

        .status {
            text-align: center;
            font-size: 18px;
            margin-bottom: 30px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .transcript {
            max-height: 300px;
            overflow-y: auto;
            border-radius: 15px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: none;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.user {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            margin-left: auto;
            text-align: right;
        }

        .message.assistant {
            background: linear-gradient(135deg, #4CAF50, #388E3C);
            margin-right: auto;
        }

        .message-header {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            opacity: 0.7;
            font-size: 14px;
        }

        .error {
            background: rgba(244, 67, 54, 0.2);
            color: #ffcdd2;
            border: 1px solid rgba(244, 67, 54, 0.5);
        }

        .success {
            background: rgba(76, 175, 80, 0.2);
            color: #c8e6c9;
            border: 1px solid rgba(76, 175, 80, 0.5);
        }

        .orders-section {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .orders-section h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .order-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #4CAF50;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .order-name {
            font-size: 1.2em;
            color: #4CAF50;
        }

        .order-time {
            font-size: 0.85em;
            opacity: 0.8;
        }

        .order-items {
            margin: 10px 0;
            padding-left: 20px;
        }

        .order-item {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }

        .order-footer {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-pickup {
            font-size: 1em;
            color: #64B5F6;
        }

        .order-total {
            text-align: right;
            font-size: 1.3em;
            font-weight: bold;
            color: #4CAF50;
        }

        .no-orders {
            text-align: center;
            opacity: 0.7;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📞 Phone Order Agent</h1>

        <div class="sdk-badge">
            OpenAI WebRTC Realtime API
        </div>

        <button id="voiceButton" class="voice-button ready">
            🎤
        </button>

        <button id="disconnectButton" class="disconnect-button" style="display: none;">
            🔌 Disconnect
        </button>

        <div id="status" class="status">
            Click the microphone to start phone order
        </div>

        <div id="transcript" class="transcript" style="display: none;">
            <!-- Conversation messages will appear here (hidden) -->
        </div>

        <div class="footer">
            Powered by OpenAI Realtime API + WebRTC
        </div>

        <div class="orders-section">
            <h2>📋 Recent Orders</h2>
            <div id="ordersContainer">
                <div class="no-orders">No orders yet</div>
            </div>
        </div>
    </div>

    <script type="module">
        class OpenAIVoiceAgent {
            constructor() {
                this.pc = null;
                this.dc = null;
                this.audioElement = null;
                this.isConnected = false;

                // Store last transcript for goodbye detection
                this.lastTranscript = null;

                // Store customer name and order details during conversation
                this.currentCustomerName = '';
                this.currentPickupTime = '';

                // Cost tracking
                this.sessionTotalCost = 0;
                this.sessionInputTokens = 0;
                this.sessionCachedInputTokens = 0;
                this.sessionOutputTokens = 0;

                // Inactivity timer - starts after response completes
                this.inactivityTimer = null;
                this.INACTIVITY_TIMEOUT = 10000; // 10 seconds

                this.initializeElements();
                this.setupEventListeners();
            }

            initializeElements() {
                this.voiceButton = document.getElementById('voiceButton');
                this.disconnectButton = document.getElementById('disconnectButton');
                this.statusDiv = document.getElementById('status');
                this.transcriptDiv = document.getElementById('transcript');
                this.ordersContainer = document.getElementById('ordersContainer');

                // Load and render existing orders on page load
                this.renderOrders();

                // Auto-refresh orders every 3 seconds to show new orders
                setInterval(() => {
                    if (this.isConnected) {
                        this.renderOrders();
                    }
                }, 3000);
            }

            setupEventListeners() {
                this.voiceButton.addEventListener('click', () => this.toggleVoiceAgent());
                this.disconnectButton.addEventListener('click', () => this.stopVoiceAgent());

                // Add test button for debugging (remove in production)
                window.addTestOrder = () => {
                    const testOrder = {
                        items: [
                            {name: "Classic Cheeseburger", price: 10.99, quantity: 2},
                            {name: "French Fries", price: 3.99, quantity: 1}
                        ],
                        total: 25.97,
                        customerName: "Test Customer",
                        timestamp: new Date().toISOString(),
                        id: `order-${Date.now()}`
                    };
                    const orders = JSON.parse(localStorage.getItem('orders') || '[]');
                    orders.push(testOrder);
                    localStorage.setItem('orders', JSON.stringify(orders));
                    this.renderOrders();
                    console.log('✅ Test order added!');
                };
            }


            // Calculate and log cost for response
            calculateRealtimeCost(usage) {
                if (!usage) {
                    console.log('⚠️ No usage data available');
                    return null;
                }

                // First, log the raw usage object to see its structure
                console.log('\n🔍 Raw usage object:', JSON.stringify(usage, null, 2));

                // Extract token counts - check for both text and audio modalities
                const textInputTokens = usage.input_token_details?.text_tokens || 0;
                const textCachedInputTokens = usage.input_token_details?.cached_text_tokens || 0;
                const audioInputTokens = usage.input_token_details?.audio_tokens || 0;
                const audioCachedInputTokens = usage.input_token_details?.cached_audio_tokens || 0;

                // Text output tokens
                const textOutputTokens = usage.output_token_details?.text_tokens || 0;
                const audioOutputTokens = usage.output_token_details?.audio_tokens || 0;

                // Fallback to total if details not available
                const totalInputTokens = usage.input_tokens || 0;
                const totalOutputTokens = usage.output_tokens || 0;

                // Pricing for gpt-realtime (per token)
                // Text tokens - cheaper
                const TEXT_INPUT_COST = 0.000004;          // $4.00 per 1M
                const TEXT_CACHED_INPUT_COST = 0.0000004;  // $0.40 per 1M
                const TEXT_OUTPUT_COST = 0.000016;         // $16.00 per 1M

                // Audio tokens - more expensive
                const AUDIO_INPUT_COST = 0.000032;          // $32.00 per 1M
                const AUDIO_CACHED_INPUT_COST = 0.0000004; // $0.40 per 1M
                const AUDIO_OUTPUT_COST = 0.000064;        // $64.00 per 1M

                // Calculate costs
                const textInputCost = textInputTokens * TEXT_INPUT_COST;
                const textCachedInputCost = textCachedInputTokens * TEXT_CACHED_INPUT_COST;
                const audioInputCost = audioInputTokens * AUDIO_INPUT_COST;
                const audioCachedInputCost = audioCachedInputTokens * AUDIO_CACHED_INPUT_COST;
                const textOutputCost = textOutputTokens * TEXT_OUTPUT_COST;
                const audioOutputCost = audioOutputTokens * AUDIO_OUTPUT_COST;

                const totalCost = textInputCost + textCachedInputCost + audioInputCost +
                                 audioCachedInputCost + textOutputCost + audioOutputCost;

                // Update session totals
                this.sessionTotalCost += totalCost;

                // Log breakdown
                console.log('\n💰 OpenAI Realtime API Cost Breakdown');
                console.log('━'.repeat(50));

                // Text tokens (cheaper)
                if (textCachedInputTokens > 0) {
                    console.log(`💾 Text Cached Input:  ${textCachedInputTokens.toLocaleString()} tokens × $0.0000004 = $${textCachedInputCost.toFixed(6)}`);
                }
                if (textInputTokens > 0) {
                    console.log(`📝 Text Input:         ${textInputTokens.toLocaleString()} tokens × $0.000004 = $${textInputCost.toFixed(6)}`);
                }
                if (textOutputTokens > 0) {
                    console.log(`📝 Text Output:        ${textOutputTokens.toLocaleString()} tokens × $0.000016 = $${textOutputCost.toFixed(6)}`);
                }

                // Audio tokens (more expensive)
                if (audioCachedInputTokens > 0) {
                    console.log(`💾 Audio Cached Input: ${audioCachedInputTokens.toLocaleString()} tokens × $0.0000004 = $${audioCachedInputCost.toFixed(6)}`);
                }
                if (audioInputTokens > 0) {
                    console.log(`🎤 Audio Input:        ${audioInputTokens.toLocaleString()} tokens × $0.000032 = $${audioInputCost.toFixed(6)}`);
                }
                if (audioOutputTokens > 0) {
                    console.log(`🎤 Audio Output:       ${audioOutputTokens.toLocaleString()} tokens × $0.000064 = $${audioOutputCost.toFixed(6)}`);
                }

                console.log('━'.repeat(50));
                console.log(`💵 Response Cost:      $${totalCost.toFixed(6)}`);
                console.log(`📊 Session Total:      $${this.sessionTotalCost.toFixed(6)}`);
                console.log('━'.repeat(50) + '\n');

                return {
                    textInputTokens,
                    textCachedInputTokens,
                    audioInputTokens,
                    audioCachedInputTokens,
                    textOutputTokens,
                    audioOutputTokens,
                    totalCost
                };
            }

            startInactivityTimer() {
                // Clear any existing timer first
                this.clearInactivityTimer();

                // Start new 10 second timer
                this.inactivityTimer = setTimeout(() => {
                    console.log('⏰ 10 seconds of inactivity - closing conversation');
                    this.stopVoiceAgent();
                }, this.INACTIVITY_TIMEOUT);
            }

            clearInactivityTimer() {
                if (this.inactivityTimer) {
                    clearTimeout(this.inactivityTimer);
                    this.inactivityTimer = null;
                }
            }

            updateStatus(message, type = 'info') {
                console.log(`[Voice Agent] ${message}`);
                this.statusDiv.innerHTML = message;
                this.statusDiv.className = `status ${type}`;

                // Update button state based on status
                this.voiceButton.className = 'voice-button';

                if (message.includes('Connecting') || message.includes('Starting')) {
                    this.voiceButton.classList.add('connecting');
                } else if (message.includes('active') || message.includes('Speaking') || message.includes('listening')) {
                    this.voiceButton.classList.add('active');
                } else if (message.includes('ready') || message.includes('Click')) {
                    this.voiceButton.classList.add('ready');
                } else if (message.includes('Error') || message.includes('Failed')) {
                    this.voiceButton.classList.add('disabled');
                }
            }

            async toggleVoiceAgent() {
                if (!this.isConnected) {
                    await this.startVoiceAgent();
                }
                // Disconnect is now handled by the separate disconnect button
            }

            async startVoiceAgent() {
                try {
                    this.updateStatus('🔄 Starting voice agent...', 'connecting');
                    this.voiceButton.disabled = true;

                    // Step 1: Get ephemeral token from our server
                    const tokenResponse = await fetch('/api/token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                    });

                    if (!tokenResponse.ok) {
                        const error = await tokenResponse.json();
                        throw new Error(error.error || 'Failed to get token');
                    }

                    const tokenData = await tokenResponse.json();
                    const ephemeralKey = tokenData.token;

                    if (!ephemeralKey) {
                        throw new Error('No token received from server');
                    }

                    console.log('✅ Got ephemeral token:', ephemeralKey.substring(0, 10) + '...');

                    // Step 2: Create WebRTC peer connection
                    this.updateStatus('🎤 Creating WebRTC connection...', 'connecting');
                    this.pc = new RTCPeerConnection();

                    // Step 3: Set up audio element for playback
                    this.audioElement = document.createElement('audio');
                    this.audioElement.autoplay = true;
                    this.pc.ontrack = (e) => {
                        console.log('📻 Received audio track from OpenAI');
                        this.audioElement.srcObject = e.streams[0];
                    };

                    // Step 4: Add local audio track for microphone input
                    const ms = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.pc.addTrack(ms.getTracks()[0]);
                    console.log('🎤 Added local microphone track');

                    // Step 5: Set up data channel for events
                    this.dc = this.pc.createDataChannel('oai-events');
                    this.setupDataChannelEvents();

                    // Step 6: Create and send SDP offer
                    this.updateStatus('🔗 Connecting to OpenAI...', 'connecting');
                    const offer = await this.pc.createOffer();
                    await this.pc.setLocalDescription(offer);

                    // Step 7: Send SDP to OpenAI with ephemeral token
                    const sdpResponse = await fetch('https://api.openai.com/v1/realtime/calls', {
                        method: 'POST',
                        body: offer.sdp,
                        headers: {
                            'Authorization': `Bearer ${ephemeralKey}`,
                            'Content-Type': 'application/sdp',
                        },
                    });

                    if (!sdpResponse.ok) {
                        const errorText = await sdpResponse.text();
                        throw new Error(`OpenAI connection failed: ${errorText}`);
                    }

                    // Step 8: Set remote description with the answer
                    const answerSdp = await sdpResponse.text();
                    const answer = {
                        type: 'answer',
                        sdp: answerSdp,
                    };
                    await this.pc.setRemoteDescription(answer);

                    this.isConnected = true;

                    this.updateStatus('🎤 Voice agent active - speak naturally!', 'success');
                    this.voiceButton.textContent = '🎤';
                    this.voiceButton.disabled = false;
                    this.disconnectButton.style.display = 'block';
                    this.showTranscript();

                    console.log('✅ OpenAI Voice Agent started via WebRTC');

                } catch (error) {
                    console.error('Failed to start voice agent:', error);
                    this.updateStatus(`❌ Error: ${error.message}`, 'error');
                    this.resetButton();
                }
            }

            setupDataChannelEvents() {
                // Listen for when data channel opens
                this.dc.addEventListener('open', () => {
                    console.log('✅ Data channel opened');

                    // Trigger AI to speak first by sending a response.create event
                    this.dc.send(JSON.stringify({
                        type: 'response.create',
                    }));
                    console.log('🎯 Triggered AI to start conversation');
                });

                // Listen for server events
                this.dc.addEventListener('message', (e) => {
                    const event = JSON.parse(e.data);
                    console.log('📨 Server event:', event);
                    this.handleServerEvent(event);
                });

                // Handle data channel errors
                this.dc.addEventListener('error', (error) => {
                    console.error('❌ Data channel error:', error);
                });

                // Handle data channel close
                this.dc.addEventListener('close', () => {
                    console.log('❌ Data channel closed');
                    this.resetConnection();
                });
            }

            handleServerEvent(event) {
                switch (event.type) {
                    case 'conversation.item.created':
                        console.log('💬 Item created:', event.item);

                        // Check for text content in the created item (for text modality)
                        if (event.item && event.item.type === 'message' && event.item.role === 'assistant') {
                            const content = event.item.content;
                            if (Array.isArray(content)) {
                                for (const part of content) {
                                    if (part.type === 'text' && part.text) {
                                        // Check for "bye" or "goodbye" in the text
                                        if (/\bbye\b/i.test(part.text) || /\bgoodbye\b/i.test(part.text)) {
                                            console.log('👋 Detected "bye/goodbye" in conversation item - auto-closing connection in 2 seconds');
                                            setTimeout(() => this.stopVoiceAgent(), 2000);
                                        }
                                    }
                                }
                            }
                        }
                        break;

                    case 'response.audio_transcript.delta':
                        console.log('📝 Transcript delta:', event.delta);
                        break;

                    case 'response.audio_transcript.done':
                        console.log('✅ Transcript done:', event.transcript);
                        this.displayMessage('assistant', event.transcript);
                        break;

                    case 'response.output_audio_transcript.done':
                        console.log('✅ Output audio transcript done:', event.transcript);
                        this.displayMessage('assistant', event.transcript);

                        // Store the last transcript for checking in response.done
                        this.lastTranscript = event.transcript;

                        // Extract pickup time from AI's confirmation (e.g., "Pickup under Alex at 6:30 PM")
                        const aiPickupMatch = event.transcript.match(/(?:pickup|see you).*?(?:at\s+)?([0-9]{1,2}(?::[0-9]{2})?\s*(?:AM|PM|am|pm))/i);
                        if (aiPickupMatch) {
                            this.currentPickupTime = aiPickupMatch[1];
                            console.log('⏰ Pickup time confirmed by AI:', this.currentPickupTime);
                        }

                        // Check if this is the FINAL confirmation with name and pickup time
                        // Example: "Let me confirm your order: 2 Classic Cheeseburgers, 1 French Fries, and 1 Coca-Cola. Pickup under Alex at 6:30 PM. Your total is $28.47."
                        if (event.transcript && (/pickup under|pickup at|see you at/i.test(event.transcript) || /let me confirm your order/i.test(event.transcript))) {
                            console.log('📋 Final order confirmation detected, parsing order...');
                            this.parseAndDisplayOrder(event.transcript);
                        }
                        break;

                    case 'response.audio.done':
                        console.log('🔊 Audio playback finished');
                        // AI finished speaking - start 10 second inactivity timer
                        console.log('⏱️ AI finished speaking - starting 10 second inactivity timer');
                        this.startInactivityTimer();
                        break;

                    case 'response.output_text.done':
                        console.log('✅ Output text done:', event);

                        // Check for "bye" or "goodbye" in assistant's output text (case-insensitive)
                        const outputText = event.text || (event.output && event.output[0]?.text);
                        if (outputText && (/\bbye\b/i.test(outputText) || /\bgoodbye\b/i.test(outputText))) {
                            console.log('👋 Detected "bye/goodbye" in output text - auto-closing connection in 2 seconds');
                            setTimeout(() => this.stopVoiceAgent(), 2000);
                        }
                        break;

                    case 'response.text.done':
                        console.log('✅ Response text done:', event);

                        // Check for "bye" or "goodbye" in response text
                        const responseText = event.text;
                        if (responseText && (/\bbye\b/i.test(responseText) || /\bgoodbye\b/i.test(responseText))) {
                            console.log('👋 Detected "bye/goodbye" in response text - auto-closing connection in 2 seconds');
                            setTimeout(() => this.stopVoiceAgent(), 2000);
                        }
                        break;

                    case 'conversation.item.input_audio_transcription.completed':
                        console.log('✅ User transcript:', event.transcript);
                        this.displayMessage('user', event.transcript);

                        // User is speaking - clear inactivity timer
                        this.clearInactivityTimer();

                        // Try to extract customer name from user's response
                        // Pattern: "My name is Alex", "I'm Alex", "This is Alex", "Alex"
                        const userNameMatch = event.transcript.match(/(?:my name is|I'm|I am|this is)\s+([A-Za-z]+)/i);
                        if (userNameMatch) {
                            this.currentCustomerName = userNameMatch[1];
                            console.log('👤 Customer name captured from user:', this.currentCustomerName);
                        } else if (!this.currentCustomerName && /^[A-Z][a-z]+$/.test(event.transcript.trim())) {
                            // If user just says a name like "Alex"
                            this.currentCustomerName = event.transcript.trim();
                            console.log('👤 Customer name captured (simple):', this.currentCustomerName);
                        }

                        // Try to extract pickup time from user's response
                        const userPickupMatch = event.transcript.match(/([0-9]{1,2}(?::[0-9]{2})?\s*(?:AM|PM|am|pm|minutes?|hours?))/i);
                        if (userPickupMatch) {
                            this.currentPickupTime = userPickupMatch[1];
                            console.log('⏰ Pickup time captured from user:', this.currentPickupTime);
                        }
                        break;

                    // Handle response completion events
                    case 'response.done':
                    case 'response.completed':
                        console.log('✅ Response completed:', event);

                        // Calculate and log cost if usage data is available
                        const usage = event.response?.usage || event.usage;
                        if (usage) {
                            this.calculateRealtimeCost(usage);
                        }

                        // Check if the last transcript contained the final goodbye phrase
                        // Only close if it says "drive safe" or "see you" with "bye" - this is the final goodbye
                        if (this.lastTranscript &&
                            ((/drive safe.*bye/i.test(this.lastTranscript)) ||
                             (/see you.*bye/i.test(this.lastTranscript)) ||
                             (/goodbye/i.test(this.lastTranscript)))) {
                            console.log('👋 Response completed with final goodbye detected - auto-closing connection in 3 seconds');
                            console.log('🔍 Detected in transcript:', this.lastTranscript);
                            setTimeout(() => this.stopVoiceAgent(), 3000);
                        }
                        // Note: Inactivity timer now starts on response.audio.done instead
                        break;

                    case 'error':
                        console.error('❌ Server error:', event.error);
                        this.updateStatus(`Error: ${event.error.message}`, 'error');
                        break;

                    default:
                        // Log other events for debugging
                        console.log('📋 Event:', event.type);
                }
            }



            parseAndDisplayOrder(confirmationText) {
                console.log('\n=== PARSING ORDER CONFIRMATION ===');
                console.log('🔍 Full confirmation text:', confirmationText);
                console.log('👤 Current customer name:', this.currentCustomerName);
                console.log('⏰ Current pickup time:', this.currentPickupTime);

                const items = [];
                let total = 0;
                let customerName = this.currentCustomerName || '';
                let pickupTime = this.currentPickupTime || '';

                // Extract customer name from confirmation text (e.g., "Pickup under Alex")
                const nameInConfirmation = confirmationText.match(/(?:pickup under|under the name)\s+([A-Za-z]+)/i);
                if (nameInConfirmation) {
                    customerName = nameInConfirmation[1];
                    console.log('👤 Customer name from confirmation:', customerName);
                }

                // Extract pickup time from confirmation text
                const pickupInConfirmation = confirmationText.match(/(?:pickup|see you).*?(?:at\s+)?([0-9]{1,2}(?::[0-9]{2})?\s*(?:AM|PM|am|pm))/i);
                if (pickupInConfirmation) {
                    pickupTime = pickupInConfirmation[1];
                    console.log('⏰ Pickup time from confirmation:', pickupTime);
                }

                // Extract total (multiple patterns)
                const totalMatch = confirmationText.match(/total is \$?([\d.]+)/i) ||
                                  confirmationText.match(/\$?([\d.]+)\s*total/i);
                if (totalMatch) {
                    total = parseFloat(totalMatch[1]);
                    console.log('💰 Total extracted:', total);
                }

                // Extract items with quantities
                // Patterns to try:
                // 1. "Let me confirm: 2 Classic Cheeseburgers, 1 French Fries and 1 Coca-Cola."
                // 2. "Let me confirm your order: 2 Classic Cheeseburgers, 1 French Fries, and 1 Coca-Cola."
                let itemsText = confirmationText.match(/confirm(?:\s+your\s+order)?[:\s]+(.+?)(?:\.|pickup|your total|is that correct)/i);
                if (itemsText) {
                    console.log('📦 Items text extracted:', itemsText[1]);
                    // Split by comma and "and"
                    const itemsList = itemsText[1].split(/,\s*(?:and\s+)?|\s+and\s+/);
                    console.log('📦 Split items:', itemsList);

                    itemsList.forEach(itemStr => {
                        // Match patterns like: "2 Classic Cheeseburgers" or "1 French Fries"
                        const itemMatch = itemStr.trim().match(/^(\d+)\s+(.+)$/);
                        if (itemMatch) {
                            const quantity = parseInt(itemMatch[1]);
                            const name = itemMatch[2].trim();
                            items.push({
                                name: name,
                                quantity: quantity,
                                price: 0
                            });
                            console.log(`  ✓ Added item: ${quantity}x ${name}`);
                        }
                    });
                } else {
                    console.warn('⚠️ Could not extract items from confirmation text');
                }

                // Create order object
                const order = {
                    items: items,
                    total: total,
                    customerName: customerName || 'Customer',
                    pickupTime: pickupTime || 'ASAP',
                    timestamp: new Date().toISOString(),
                    id: `order-${Date.now()}`
                };

                console.log('📋 Final parsed order:', JSON.stringify(order, null, 2));

                // Save to localStorage
                const orders = JSON.parse(localStorage.getItem('orders') || '[]');
                orders.push(order);
                localStorage.setItem('orders', JSON.stringify(orders));
                console.log('💾 Order saved to localStorage. Total orders:', orders.length);

                // Refresh the orders display
                this.renderOrders();
                console.log('🖥️ Orders display refreshed');

                // Reset captured info for next order
                this.currentCustomerName = '';
                this.currentPickupTime = '';

                console.log('✅ Order processing complete!');
                console.log('=================================\n');
            }

            renderOrders() {
                const orders = JSON.parse(localStorage.getItem('orders') || '[]');

                if (orders.length === 0) {
                    this.ordersContainer.innerHTML = '<div class="no-orders">No orders yet</div>';
                    return;
                }

                // Reverse to show most recent first
                const recentOrders = orders.slice().reverse();

                this.ordersContainer.innerHTML = recentOrders.map(order => {
                    const date = new Date(order.timestamp);
                    const timeStr = date.toLocaleTimeString('en-US', {
                        hour: 'numeric',
                        minute: '2-digit',
                        hour12: true
                    });
                    const dateStr = date.toLocaleDateString('en-US', {
                        month: 'short',
                        day: 'numeric'
                    });

                    return `
                        <div class="order-card">
                            <div class="order-header">
                                <span class="order-name">👤 ${order.customerName || 'Guest'}</span>
                                <span class="order-time">${timeStr} · ${dateStr}</span>
                            </div>
                            <div class="order-items">
                                ${order.items.map(item => `
                                    <div class="order-item">
                                        <span>${item.quantity}x ${item.name}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="order-footer">
                                <div class="order-pickup">
                                    🕒 Pickup: ${order.pickupTime || 'ASAP'}
                                </div>
                                <div class="order-total">
                                    Total: $${order.total.toFixed(2)}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            displayMessage(sender, text) {
                if (!text || text.trim() === '') return;

                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;

                const headerDiv = document.createElement('div');
                headerDiv.className = 'message-header';
                headerDiv.textContent = sender === 'user' ? 'You' : 'Assistant';

                const textDiv = document.createElement('div');
                textDiv.textContent = text;

                messageDiv.appendChild(headerDiv);
                messageDiv.appendChild(textDiv);

                this.transcriptDiv.appendChild(messageDiv);
                this.scrollToBottom();
            }

            appendToLastMessage(sender, text) {
                if (!text) return;

                const messages = this.transcriptDiv.querySelectorAll('.message');
                const lastMessage = messages[messages.length - 1];

                if (lastMessage && lastMessage.classList.contains(sender)) {
                    const textDiv = lastMessage.querySelector('div:last-child');
                    textDiv.textContent += text;
                } else {
                    this.displayMessage(sender, text);
                }

                this.scrollToBottom();
            }

            showTranscript() {
                // Keep transcript hidden
                this.transcriptDiv.style.display = 'none';
            }

            scrollToBottom() {
                this.transcriptDiv.scrollTop = this.transcriptDiv.scrollHeight;
            }

            async stopVoiceAgent() {
                try {
                    this.updateStatus('🛑 Stopping voice agent...', 'connecting');

                    this.isConnected = false;

                    // Clear inactivity timer
                    this.clearInactivityTimer();

                    // Log final session cost
                    if (this.sessionTotalCost > 0) {
                        console.log('\n' + '═'.repeat(50));
                        console.log('💰 FINAL SESSION COST');
                        console.log('═'.repeat(50));
                        if (this.sessionCachedInputTokens > 0) {
                            console.log(`💾 Cached Input Tokens:  ${this.sessionCachedInputTokens.toLocaleString()}`);
                        }
                        if (this.sessionInputTokens > 0) {
                            console.log(`📥 Input Tokens:         ${this.sessionInputTokens.toLocaleString()}`);
                        }
                        console.log(`📤 Output Tokens:        ${this.sessionOutputTokens.toLocaleString()}`);
                        console.log('═'.repeat(50));
                        console.log(`💵 Total Session Cost:   $${this.sessionTotalCost.toFixed(6)}`);
                        console.log('═'.repeat(50) + '\n');
                    }

                    // Close data channel
                    if (this.dc) {
                        this.dc.close();
                        this.dc = null;
                    }

                    // Close peer connection
                    if (this.pc) {
                        this.pc.close();
                        this.pc = null;
                    }

                    // Stop audio element
                    if (this.audioElement) {
                        this.audioElement.srcObject = null;
                        this.audioElement = null;
                    }

                    // Reset cost tracking for next session
                    this.sessionTotalCost = 0;
                    this.sessionInputTokens = 0;
                    this.sessionCachedInputTokens = 0;
                    this.sessionOutputTokens = 0;

                    this.resetButton();
                    this.disconnectButton.style.display = 'none';
                    this.updateStatus('Click the microphone to start phone order', 'ready');

                } catch (error) {
                    console.error('Error stopping voice agent:', error);
                    this.resetButton();
                }
            }

            resetConnection() {
                this.isConnected = false;
                this.resetButton();
                this.disconnectButton.style.display = 'none';
            }


            resetButton() {
                this.voiceButton.disabled = false;
                this.voiceButton.textContent = '🎤';
                this.voiceButton.className = 'voice-button ready';
                this.disconnectButton.style.display = 'none';
            }
        }

        // Initialize voice agent when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new OpenAIVoiceAgent();
            console.log('🎙️ OpenAI Voice Agent initialized');
            console.log('📚 Using OpenAI Realtime API with WebRTC');
        });
    </script>
</body>
