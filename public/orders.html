<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 Orders - Joe's Diner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .stats-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .section-title {
            font-size: 1.8em;
            font-weight: 600;
        }

        .clear-btn {
            background: linear-gradient(135deg, #ff4757, #c44569);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.4);
        }

        .order-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #4CAF50;
            transition: all 0.3s ease;
        }

        .order-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .order-card.current {
            border-left-color: #FF9800;
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.2), rgba(245, 124, 0, 0.1));
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .order-name {
            font-size: 1.4em;
            font-weight: bold;
            color: #4CAF50;
        }

        .order-card.current .order-name {
            color: #FF9800;
        }

        .order-time {
            font-size: 0.85em;
            opacity: 0.8;
        }

        .order-items {
            margin: 15px 0;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .order-item {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }

        .item-name {
            font-weight: 500;
        }

        .order-footer {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-pickup {
            font-size: 1.1em;
            color: #64B5F6;
            font-weight: 500;
        }

        .order-total {
            font-size: 1.5em;
            font-weight: bold;
            color: #4CAF50;
        }

        .order-card.current .order-total {
            color: #FF9800;
        }

        .no-orders {
            text-align: center;
            opacity: 0.7;
            padding: 40px;
            font-size: 1.2em;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-new {
            background: rgba(33, 150, 243, 0.3);
            border: 1px solid #2196F3;
            color: #BBDEFB;
        }

        .status-current {
            background: rgba(255, 152, 0, 0.3);
            border: 1px solid #FF9800;
            color: #FFE0B2;
        }

        .status-completed {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid #4CAF50;
            color: #C8E6C9;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .confirm-btn, .complete-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }

        .confirm-btn:hover, .complete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .cancel-btn {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
        }

        .cancel-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }

        .order-card.new {
            border-left-color: #2196F3;
        }

        @media (max-width: 768px) {
            .orders-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Order Management</h1>
            <p>Track current orders and view order history</p>
            <div class="nav-links">
                <a href="/menu" class="nav-link">🍽️ Manage Menu</a>
            </div>
        </header>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="todayOrders">0</div>
                <div class="stat-label">Today's Orders</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalRevenue">$0.00</div>
                <div class="stat-label">Total Revenue</div>
            </div>
        </div>

        <div class="orders-grid">
            <div class="section">
                <div class="section-header">
                    <h2 class="section-title">🆕 New Orders</h2>
                </div>
                <div id="newOrders">
                    <div class="no-orders">No new orders</div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <h2 class="section-title">🔥 In Progress</h2>
                </div>
                <div id="inProgressOrders">
                    <div class="no-orders">No orders in progress</div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <h2 class="section-title">✅ Completed</h2>
                    <button class="clear-btn" onclick="clearCompleted()">🗑️ Clear</button>
                </div>
                <div id="completedOrders">
                    <div class="no-orders">No completed orders</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let orders = [];
        const CURRENT_ORDER_TIME_LIMIT = 30 * 60 * 1000; // 30 minutes

        async function loadOrders() {
            // Load orders from server (includes both browser and phone orders)
            try {
                const response = await fetch('/api/orders');
                if (response.ok) {
                    orders = await response.json();
                } else {
                    // Fallback to localStorage if server fails
                    orders = JSON.parse(localStorage.getItem('orders') || '[]');
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                // Fallback to localStorage
                orders = JSON.parse(localStorage.getItem('orders') || '[]');
            }

            renderOrders();
            updateStats();
        }

        function renderOrders() {
            const newOrders = orders.filter(o => o.status === 'new' || !o.status);
            const inProgressOrders = orders.filter(o => o.status === 'in_progress');
            const completedOrders = orders.filter(o => o.status === 'completed');

            // Render new orders
            const newContainer = document.getElementById('newOrders');
            if (newOrders.length === 0) {
                newContainer.innerHTML = '<div class="no-orders">No new orders</div>';
            } else {
                newContainer.innerHTML = newOrders.reverse().map(order => renderOrderCard(order, 'new')).join('');
            }

            // Render in progress orders
            const inProgressContainer = document.getElementById('inProgressOrders');
            if (inProgressOrders.length === 0) {
                inProgressContainer.innerHTML = '<div class="no-orders">No orders in progress</div>';
            } else {
                inProgressContainer.innerHTML = inProgressOrders.reverse().map(order => renderOrderCard(order, 'in_progress')).join('');
            }

            // Render completed orders
            const completedContainer = document.getElementById('completedOrders');
            if (completedOrders.length === 0) {
                completedContainer.innerHTML = '<div class="no-orders">No completed orders</div>';
            } else {
                completedContainer.innerHTML = completedOrders.reverse().map(order => renderOrderCard(order, 'completed')).join('');
            }
        }

        function renderOrderCard(order, status) {
            const date = new Date(order.timestamp);
            const timeStr = date.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
            const dateStr = date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric'
            });

            let statusBadge = '';
            let actionButtons = '';
            let cardClass = '';

            if (status === 'new') {
                statusBadge = '<span class="status-badge status-new">New</span>';
                actionButtons = `
                    <div class="action-buttons">
                        <button class="action-btn confirm-btn" onclick="confirmOrder('${order.id}')">✓ Confirm</button>
                        <button class="action-btn cancel-btn" onclick="cancelOrder('${order.id}')">✗ Cancel</button>
                    </div>`;
                cardClass = 'new';
            } else if (status === 'in_progress') {
                statusBadge = '<span class="status-badge status-current">In Progress</span>';
                actionButtons = `
                    <div class="action-buttons">
                        <button class="action-btn complete-btn" onclick="completeOrder('${order.id}')">✓ Complete</button>
                        <button class="action-btn cancel-btn" onclick="cancelOrder('${order.id}')">✗ Cancel</button>
                    </div>`;
                cardClass = 'current';
            } else if (status === 'completed') {
                statusBadge = '<span class="status-badge status-completed">Completed</span>';
                cardClass = '';
            }

            const sourceIcon = order.source === 'phone' ? '📞' : '💻';
            const sourceLabel = order.source === 'phone' ? 'Phone' : 'Web';
            const phoneDisplay = order.phoneNumber ? `<div style="font-size: 0.9em; opacity: 0.9; margin-top: 5px;">📱 +1 ${order.phoneNumber}</div>` : '';

            return `
                <div class="order-card ${cardClass}">
                    <div class="order-header">
                        <div>
                            <div class="order-name">👤 ${order.customerName || 'Guest'} <span style="font-size: 0.8em; opacity: 0.8;">${sourceIcon} ${sourceLabel}</span></div>
                            ${phoneDisplay}
                            ${statusBadge}
                        </div>
                        <div class="order-time">${timeStr}<br>${dateStr}</div>
                    </div>
                    <div class="order-items">
                        ${order.items.map(item => `
                            <div class="order-item">
                                <span class="item-name">${item.quantity}x ${item.name}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="order-footer">
                        <div class="order-pickup">
                            🕒 Pickup: ${order.pickupTime || 'ASAP'}
                        </div>
                        <div class="order-total">
                            $${order.total.toFixed(2)}
                        </div>
                    </div>
                    ${actionButtons}
                </div>
            `;
        }

        function updateStats() {
            // Total orders
            document.getElementById('totalOrders').textContent = orders.length;

            // Today's orders
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayOrders = orders.filter(order => {
                const orderDate = new Date(order.timestamp);
                orderDate.setHours(0, 0, 0, 0);
                return orderDate.getTime() === today.getTime();
            });
            document.getElementById('todayOrders').textContent = todayOrders.length;

            // Total revenue
            const totalRevenue = orders.reduce((sum, order) => sum + (order.total || 0), 0);
            document.getElementById('totalRevenue').textContent = `$${totalRevenue.toFixed(2)}`;
        }

        async function confirmOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'in_progress';
                await saveOrders();
                renderOrders();
            }
        }

        async function completeOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'completed';
                await saveOrders();
                renderOrders();
            }
        }

        async function cancelOrder(orderId) {
            if (confirm('Are you sure you want to cancel this order?')) {
                orders = orders.filter(o => o.id !== orderId);
                await saveOrders();
                renderOrders();
                updateStats();
            }
        }

        async function saveOrders() {
            try {
                await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orders })
                });
            } catch (error) {
                console.error('Error saving orders:', error);
            }
        }

        function clearCompleted() {
            if (confirm('Are you sure you want to clear all completed orders?')) {
                orders = orders.filter(o => o.status !== 'completed');
                saveOrders();
                renderOrders();
                updateStats();
            }
        }

        // Load orders on page load
        loadOrders();

        // Auto-refresh every 3 seconds
        setInterval(loadOrders, 3000);
    </script>
</body>
</html>
